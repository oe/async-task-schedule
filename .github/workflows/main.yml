name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Typecheck
        run: yarn typecheck
      - name: Test including performance regression budgets
        run: yarn test
      - name: Benchmark against the pre-refactor implementation
        run: yarn benchmark
      - name: Check packed imports and legacy TypeScript consumers
        run: node scripts/check-package.cjs
      - name: Upload performance measurements
        uses: actions/upload-artifact@v4
        with:
          name: perf-node-${{ matrix.node }}
          path: perf-results.json
